<!DOCTYPE html>
<html>
<head>
    <title>Day 14 - To Do App with Local Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            color: blue;
        }

        input {
            padding: 8px;
            width: 200px;
            font-size: 15px;
        }

        button {
            padding: 8px 14px;
            font-size: 15px;
            cursor: pointer;
            background: blue;
            color: white;
            border: none;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            padding: 8px;
            margin: 6px 0;
            background: #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <h1>Day 14 - To Do App</h1>
    <p>Tasks are saved even after page refresh!</p>

    <input type="text" id="taskInput" placeholder="enter task here" />
    <button onclick="addTask()">Add Task</button>
    <button onclick="clearAll()" style="background:gray; margin-left:5px;">Clear All</button>

    <p id="errorMsg" style="color:red;"></p>

    <ul id="taskList"></ul>

    <script>

        window.onload = function(){
            loadTasks()
        }

        function loadTasks(){
            let tasks = JSON.parse(localStorage.getItem("tasks")) || []

            tasks.forEach(function(task){
                createTaskElement(task.text, task.done)
            })
        }

        function saveTasks(){
            let items = document.querySelectorAll("#taskList li")
            let tasks = []

            items.forEach(function(item){
                tasks.push({
                    text: item.getAttribute("data-text"),
                    done: item.classList.contains("done")
                })
            })

            localStorage.setItem("tasks", JSON.stringify(tasks))
        }

        function createTaskElement(text, done){
            let li = document.createElement("li")
            li.setAttribute("data-text", text)
            li.innerText = text

            if(done){
                li.classList.add("done")
            }

            li.onclick = function(){
                li.classList.toggle("done")
                saveTasks()
            }

            let deleteBtn = document.createElement("button")
            deleteBtn.innerText = "Delete"
            deleteBtn.className = "delete-btn"

            deleteBtn.onclick = function(e){
                e.stopPropagation()
                li.parentNode.removeChild(li)
                saveTasks()
            }

            li.appendChild(deleteBtn)
            document.getElementById("taskList").appendChild(li)
        }

        function addTask(){
            let input = document.getElementById("taskInput").value

            if(input == ""){
                document.getElementById("errorMsg").innerText = "please enter a task"
                return
            }

            document.getElementById("errorMsg").innerText = ""
            createTaskElement(input, false)
            saveTasks()

            document.getElementById("taskInput").value = ""
        }

        function clearAll(){
            document.getElementById("taskList").innerHTML = ""
            localStorage.removeItem("tasks")
        }

    </script>

</body>
</html>
